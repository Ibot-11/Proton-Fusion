name: Fusion build validation

on:
  push:
    branches: [fusion]
  pull_request:
    branches: [fusion]
  workflow_dispatch:
    inputs:
      build_sdk:
        description: Build the complete redistributable on a configured Proton builder
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison flex libx11-dev libxext-dev libxcomposite-dev libxdamage-dev libxrender-dev libxrandr-dev libxfixes-dev libfreetype-dev libfontconfig-dev libgnutls28-dev libvulkan-dev
      - name: Initialize the pinned code and check patch applicability
        run: |
          git submodule update --init --depth=1 wine dxvk
          python3 fusion/scripts/prepare.py --check
          python3 -m py_compile fusion/scripts/*.py fusion/tests/*.py
          for script in fusion/scripts/*.sh fusion/tests/*.sh; do bash -n "$script"; done
          git diff --check
      - name: Compile the affected Unix modules
        run: bash fusion/scripts/build-native-modules.sh "$RUNNER_TEMP/fusion-native" 2>&1 | tee "$RUNNER_TEMP/fusion-native-build.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-build-evidence-not-a-portable-release
          path: |
            ${{ runner.temp }}/fusion-native-build.log
            ${{ runner.temp }}/fusion-native/dlls/win32u/win32u.so
            ${{ runner.temp }}/fusion-native/dlls/winex11.drv/winex11.so
          retention-days: 14

  sdk-redistributable:
    if: github.event_name == 'workflow_dispatch' && inputs.build_sdk
    runs-on: [self-hosted, linux, x64, proton-builder]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the complete Proton SDK redistributable
        run: bash fusion/scripts/build-sdk.sh "$RUNNER_TEMP/proton-fusion-sdk" 2>&1 | tee "$RUNNER_TEMP/proton-fusion-sdk.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Proton-Fusion-sdk-redistributable
          path: ${{ runner.temp }}/proton-fusion-sdk/redist/
          retention-days: 14
